# Companies whose public job boards JOBOS polls.
# ats_type: greenhouse | lever | ashby
# ats_identifier: the board token in the public URL, e.g.
#   https://boards-api.greenhouse.io/v1/boards/<ats_identifier>/jobs
#   https://api.lever.co/v0/postings/<ats_identifier>
# Edit freely — this is a starting point, not a fixed list.
#
# Every identifier below was verified live (2026-08-12) by hitting the
# actual public endpoint and checking it returns this company's real jobs,
# not just a 200. Razorpay, Zerodha, Freshworks, Hasura, Chargebee, Zoho,
# and Swiggy were previously listed here but all 404 or return zero jobs as
# of this date — those companies no longer expose (or never exposed) a
# public board on greenhouse/lever/ashby under the token that was guessed.
# Don't re-add a company without verifying its board the same way: a 404
# silently contributes zero jobs forever, and a wrong-but-live token risks
# seeding a different company's postings under this one's name.
companies:
  - name: Postman
    domain: postman.com
    ats_type: greenhouse
    ats_identifier: postman
  - name: Groww
    domain: groww.in
    ats_type: greenhouse
    ats_identifier: groww
  - name: CRED
    domain: cred.club
    ats_type: lever
    ats_identifier: cred
  - name: Meesho
    domain: meesho.com
    ats_type: lever
    ats_identifier: meesho
